<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONIC MARKET — سوق سونيك</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "OnlineStore",
  "name": "Sonic Market — سوق سونيك",
  "alternateName": "SONIC MARKET",
  "slogan": "بيع. بدّل. اكتشف. بسرعة سونيك.",
  "description": "سوق إعلانات محلي سريع لبيع وتبديل الأغراض، تتم مراجعة كل إعلان قبل نشره.",
  "inLanguage": "ar",
  "areaServed": "DZ",
  "priceRange": "متغيّر",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "https://sonic-market.example/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  },
  "makesOffer": {
    "@type": "OfferCatalog",
    "name": "فئات السوق",
    "itemListElement": [
      { "@type": "Offer", "category": "إلكترونيات" },
      { "@type": "Offer", "category": "ملابس" },
      { "@type": "Offer", "category": "أثاث" },
      { "@type": "Offer", "category": "كتب وقرطاسية" },
      { "@type": "Offer", "category": "ألعاب" },
      { "@type": "Offer", "category": "رياضة" }
    ]
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Reem+Kufi:wght@400..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1264ff;
    --blue-dark:#06163d;
    --blue-mid:#2588ff;
    --blue-light:#5B93FF;
    --cyan:#49d7ff;
    --gold:#ffd43b;
    --red:#ff4057;
    --green:#20d486;
    --bg:#f3f7ff;
    --glass:rgba(255,255,255,.78);
    --card-shadow: 0 4px 18px rgba(11,31,77,.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:
      radial-gradient(circle at 8% 8%,rgba(65,153,255,.20),transparent 28%),
      radial-gradient(circle at 95% 18%,rgba(255,214,64,.17),transparent 24%),
      linear-gradient(180deg,#edf5ff 0%,#f7faff 52%,#eef4ff 100%);
    color:var(--blue-dark);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#c3d4f7;border-radius:10px;}

  /* ---------- HERO ---------- */
  .hero{
    background: linear-gradient(125deg, var(--blue-dark) 0%, var(--blue) 55%, var(--blue-mid) 100%);
    color:white;
    padding:20px 18px 24px;
    position:sticky; top:0; z-index:30;
    overflow:hidden;
    border-radius:0 0 28px 28px;
    box-shadow:0 10px 28px rgba(7,24,66,.28);
  }
  .hero::after{
    content:"";
    position:absolute;
    width:180px;height:180px;
    left:-70px;bottom:-110px;
    border:24px solid rgba(255,255,255,.10);
    border-radius:50%;
    box-shadow:0 0 0 18px rgba(255,255,255,.06),0 0 0 42px rgba(255,255,255,.035);
    pointer-events:none;
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo-ring{
    width:46px;height:46px;border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), #fff2b8, var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    box-shadow:0 0 0 4px rgba(255,255,255,.22), 0 4px 10px rgba(0,0,0,.2);
    animation: spin 6s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .brand-name{font-weight:900;font-size:20px;line-height:1.15;letter-spacing:-.3px;}
  .brand-tag{font-size:11.5px;opacity:.82;font-weight:600;margin-top:2px;}
  .stat-pill{
    background:rgba(255,255,255,.16);
    backdrop-filter:blur(4px);
    border-radius:14px;
    padding:6px 12px;
    font-size:11.5px;font-weight:700;text-align:center;
  }
  .stat-pill b{display:block;font-size:16px;font-weight:900;}

  .tabs{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;}
  .tab-btn{
    flex:1;padding:10px 8px;border:none;border-radius:14px;
    font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;
    background:rgba(255,255,255,.14);color:white;
    transition:.18s; display:flex;align-items:center;justify-content:center;gap:6px;
    position:relative;
  }
  .tab-btn.active{ background:white; color:var(--blue-dark); box-shadow:0 4px 10px rgba(0,0,0,.15); }
  .tab-btn:active{ transform:scale(.96); }
  .mini-chip{
    background:var(--red); color:white; font-size:10px; font-weight:900;
    border-radius:20px; padding:1px 6px; min-width:16px;
  }

  .container{max-width:660px;margin:0 auto;padding:16px 14px 110px;}

  /* ---------- SEARCH ---------- */
  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-box{
    flex:1;position:relative;
  }
  .search-box input{
    width:100%;font-family:inherit;
    border:2px solid #dbe6ff;border-radius:14px;
    padding:11px 14px 11px 14px;padding-right:38px;
    font-size:14px;background:white;
    box-shadow:var(--card-shadow);
  }
  .search-box input:focus{ outline:none; border-color:var(--blue-light); }
  .search-box .sicon{position:absolute; right:12px; top:50%; transform:translateY(-50%); opacity:.5;}
  .search-row select{
    font-family:inherit;border:2px solid #dbe6ff;border-radius:14px;
    padding:11px 10px;font-size:13.5px;background:white;box-shadow:var(--card-shadow);
    max-width:118px;
  }

  .cat-scroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; scrollbar-width:none; }
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0; padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:700;
    background:white; border:2px solid #dbe6ff; color:var(--blue-dark); cursor:pointer; white-space:nowrap;
    transition:.15s;
  }
  .cat-chip.active{ background:var(--blue); border-color:var(--blue); color:white; }

  /* ---------- GRID / CARDS ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr;}}
  .card{
    background:white;border-radius:18px;padding:11px;
    box-shadow:var(--card-shadow);border:1px solid #eef3ff;
    display:flex;flex-direction:column;gap:6px;position:relative;
    transition:.18s;
  }
  .card:active{ transform:scale(.98); }
  .thumb{
    width:100%;aspect-ratio:1/1;border-radius:13px;
    background:linear-gradient(135deg,#e2ecff,#f4f8ff);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;overflow:hidden;position:relative;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .badge{
    position:absolute; top:19px; right:19px; font-size:10.5px;font-weight:900;
    padding:4px 10px;border-radius:20px;color:white; box-shadow:0 2px 6px rgba(0,0,0,.15);
    display:flex; align-items:center; gap:3px;
  }
  .badge.sale{background:linear-gradient(120deg,var(--blue),var(--blue-light));}
  .badge.trade{background:linear-gradient(120deg,var(--gold),#ffb84f);color:#5c3d00;}
  .card h3{margin:2px 0 0;font-size:14px;font-weight:800;color:var(--blue-dark);line-height:1.3;}
  .card p.desc{margin:0;font-size:11.5px;color:#7284ab;line-height:1.4;min-height:15px;max-height:30px;overflow:hidden;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .price{font-weight:900;color:var(--red);font-size:13.5px;}
  .price.trade{color:#b8860b;font-size:12px;}
  .contact-btn{
    background:var(--blue-dark);color:white;border:none;width:100%;
    padding:9px;border-radius:11px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;
    margin-top:2px; display:flex;align-items:center;justify-content:center;gap:5px;
    transition:.15s;
  }
  .contact-btn:active{transform:scale(.96);}
  .contact-btn.disabled{opacity:.45;}
  .contact-btn.wa{ background:linear-gradient(120deg,#1fae5c,#25C77A); }
  .card-actions{display:flex;gap:6px;margin-top:2px;}
  .card-actions .contact-btn{width:auto;flex:1;margin-top:0;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; bottom:24px; left:22px;
    width:60px;height:60px;border-radius:50%;
    background:linear-gradient(135deg,var(--red),#ff7a45);
    color:white;font-size:30px;font-weight:900;
    border:3px solid white;
    box-shadow:0 8px 22px rgba(255,59,59,.5);
    cursor:pointer; z-index:40;
    display:flex;align-items:center;justify-content:center;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{box-shadow:0 8px 22px rgba(255,59,59,.5);} 50%{box-shadow:0 8px 30px rgba(255,59,59,.75), 0 0 0 8px rgba(255,59,59,.12);} }
  .fab:active{ transform:scale(.92); }

  /* ---------- MODAL ---------- */
  .modal-bg{
    position:fixed;inset:0;background:rgba(7,24,66,.6); backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center; z-index:50;
    animation:fadeIn .15s ease-out;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:white;width:100%;max-width:540px;
    border-radius:24px 24px 0 0; padding:20px 20px 26px;
    max-height:90vh;overflow-y:auto; animation:up .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes up{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{ width:40px;height:5px;background:#e0e7f7;border-radius:10px;margin:0 auto 14px; }
  .modal h2{margin:0 0 16px;color:var(--blue-dark);font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12.5px;font-weight:800;margin-bottom:6px;color:#4a5a80;}
  .field input, .field select, .field textarea{
    width:100%;font-family:inherit;border:2px solid #e2eaff;border-radius:12px;
    padding:10px 12px;font-size:14px;background:#f8faff; transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--blue-light); background:white; }
  .field textarea{resize:vertical;min-height:64px;}
  .radio-row{display:flex;gap:10px;}
  .radio-opt{
    flex:1;border:2px solid #e2eaff;border-radius:12px;padding:11px;text-align:center;
    cursor:pointer;font-weight:800;font-size:13.5px;color:#8393b8; transition:.15s;
  }
  .radio-opt.selected.sale{border-color:var(--blue);background:#eaf1ff;color:var(--blue);}
  .radio-opt.selected.trade{border-color:var(--gold);background:#fff8e2;color:#8a6a00;}
  .btn-main{
    width:100%;padding:13px;border:none;border-radius:14px;
    background:linear-gradient(120deg,var(--blue),var(--blue-mid));color:white;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;
    margin-top:8px; box-shadow:0 6px 16px rgba(30,95,255,.35); transition:.15s;
  }
  .btn-main:active{ transform:scale(.98); }
  .btn-ghost{
    width:100%;padding:11px;border:2px solid #e2eaff;border-radius:14px;background:white;
    color:#5b6b8c;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:9px;
  }
  
.payment-choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.payment-choice .pay-opt{border:2px solid #e2eaff;border-radius:13px;padding:11px 9px;text-align:center;cursor:pointer;font-weight:900;font-size:12.5px;color:#7183a8;background:#fff;transition:.15s}
.payment-choice .pay-opt.selected{border-color:#0b63ff;background:#edf5ff;color:#0756e8;box-shadow:0 4px 12px rgba(11,99,255,.12)}
.payment-store-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.payment-store-grid .store-opt{border:1px solid #dce7f8;background:#f8fbff;border-radius:10px;padding:8px 6px;text-align:center;font:800 10.5px Cairo;color:#29456f;cursor:pointer}
.payment-store-grid .store-opt.selected{border-color:#0b63ff;background:#eaf3ff;color:#0756e8;box-shadow:0 3px 9px rgba(11,99,255,.10)}
.payment-bank-note{font-size:10px;color:#8191ae;margin-top:5px;font-weight:700;line-height:1.6}
.ff-code-box{margin-top:10px;padding:11px;border:1px solid #dce7f8;border-radius:14px;background:#f8fbff}
.ff-code-box>b{display:block;font-size:12px;color:#17345f;margin-bottom:3px}
.ff-code-box>small{display:block;font-size:9px;color:#8191ae;margin-bottom:8px;line-height:1.6}
.ff-code-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.ff-code-row>span{width:25px;height:25px;border-radius:8px;background:#eaf2ff;color:#0756e8;display:flex;align-items:center;justify-content:center;font:900 10px Cairo;flex-shrink:0}
.ff-code-row input{flex:1;border:1px solid #dce7f8;border-radius:9px;padding:8px 9px;font:600 11px 'JetBrains Mono',monospace;direction:ltr;text-align:left;background:#fff}
.ff-code-row.required input{border-color:#b9d5ff}
.ff-code-row input:disabled{background:#eef2f7;color:#a6b1c4}
.admin-code-list{margin-top:7px;padding:8px;border:1px solid #e2e9f6;border-radius:10px;background:#f8fbff}
.admin-code-list>b{display:block;font-size:10px;color:#17345f;margin-bottom:5px}
.admin-code-list>div{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:9px}
.admin-code-list>div>span{min-width:22px;color:#8191ae;font-weight:900}
.admin-code-list code{direction:ltr;unicode-bidi:plaintext;background:#fff;border:1px solid #dce7f8;border-radius:7px;padding:4px 6px;font:600 9px 'JetBrains Mono',monospace;word-break:break-all}

@media(max-width:380px){.payment-store-grid{grid-template-columns:1fr}}
.img-preview{ width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid #e2eaff; }

  /* ---------- EMPTY / LOADING ---------- */
  .empty{text-align:center;padding:60px 20px;color:#8393b8;}
  .empty .emoji{font-size:46px;margin-bottom:8px;}
  .empty b{color:var(--blue-dark);display:block;margin-bottom:4px;font-size:14.5px;}
  .skel-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  @media(min-width:560px){.skel-grid{grid-template-columns:1fr 1fr 1fr;}}
  .skel-card{ background:white;border-radius:18px;padding:11px; box-shadow:var(--card-shadow); }
  .skel-box{ background:linear-gradient(90deg,#eef2fb 25%,#f7f9ff 37%,#eef2fb 63%); background-size:400% 100%; animation:shimmer 1.4s infinite; border-radius:10px; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;bottom:24px;right:16px;left:16px;max-width:520px;margin:0 auto;
    background:var(--blue-dark);color:white;padding:13px 18px;border-radius:14px;
    font-weight:700;font-size:13.5px;text-align:center;z-index:60;
    box-shadow:0 10px 26px rgba(0,0,0,.3); animation: toastIn .2s ease-out;
  }
  @keyframes toastIn{ from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }

  /* ---------- ADMIN ---------- */
  .admin-lock{ text-align:center;padding:70px 20px; }
  .admin-lock .lock-circle{
    width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-mid));
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;
    box-shadow:0 8px 20px rgba(30,95,255,.35);
  }
  .admin-lock input{
    width:100%;max-width:260px;margin:16px auto 6px;display:block;
    text-align:center;border:2px solid #e2eaff;border-radius:12px;padding:12px;font-family:inherit;font-size:15px;
  }
  .admin-lock input:focus{outline:none;border-color:var(--blue-light);}
  .admin-stats{ display:flex; gap:10px; margin:16px 0; }
  .stat-card{
    flex:1; background:white; border-radius:16px; padding:14px 10px; text-align:center;
    box-shadow:var(--card-shadow); border:1px solid #eef3ff;
  }
  .stat-card .num{ font-size:22px; font-weight:900; }
  .stat-card .lbl{ font-size:11px; font-weight:700; color:#8393b8; margin-top:2px; }
  .stat-card.pending .num{ color:var(--gold-dark,#d99b00); }
  .stat-card.approved .num{ color:var(--green); }
  .stat-card.total .num{ color:var(--blue); }
  .admin-header{ display:flex;justify-content:space-between;align-items:center;margin-top:4px; }
  .admin-header h2{ margin:0; font-size:17px; font-weight:900; }
  .logout-btn{
    border:2px solid #ffd9d9; background:#fff3f3; color:var(--red); font-family:inherit;
    font-weight:800; font-size:12.5px; padding:8px 14px; border-radius:12px; cursor:pointer;
  }
  .admin-section h3{
    font-size:13.5px;color:var(--blue-dark);margin:20px 0 10px; font-weight:900;
    display:flex; align-items:center; gap:6px;
  }
  .admin-row{
    background:white;border-radius:16px;padding:12px;margin-bottom:10px;
    border:1px solid #eef3ff; box-shadow:var(--card-shadow);
    display:flex;gap:11px;align-items:flex-start;
  }
  .thumb-sm{
    width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#e2ecff,#f4f8ff);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;
  }
  .thumb-sm img{width:100%;height:100%;object-fit:cover;}
  .admin-row .info{flex:1;min-width:0;}
  .admin-row .info h4{margin:0 0 3px;font-size:13.5px;color:var(--blue-dark);font-weight:800;}
  .admin-row .info p{margin:0 0 2px;font-size:11.5px;color:#7284ab;}
  .admin-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .icon-btn{ border:none;border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer; transition:.15s; }
  .icon-btn:active{transform:scale(.9);}
  .icon-btn.ok{background:#dff5e3;color:#1a8a3d;}
  .icon-btn.no{background:#ffe3e3;color:var(--red);}
  .icon-btn.mid{background:#eef2ff;color:#2b4b9e;}

.logo-ring{
  background:linear-gradient(145deg,#fff,#ffd83d);
  color:#0756e8;
}
.container{max-width:920px}
.grid{gap:16px}
.card{
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 8px 25px rgba(11,45,110,.09);
  overflow:hidden;
}

  transform:translateY(-4px);
  box-shadow:0 15px 34px rgba(11,45,110,.15);
}
.thumb{
  background:
    radial-gradient(circle at 35% 25%,rgba(73,215,255,.25),transparent 28%),
    linear-gradient(145deg,#dceaff,#f8fbff);
}
.card h3{font-size:14.5px}
.contact-btn{
  background:linear-gradient(110deg,#06163d,#1264ff);
}

  width:64px;height:64px;
  background:linear-gradient(145deg,#ff3550,#ff7549);
  box-shadow:0 10px 30px rgba(255,53,80,.42);
}

  content:"";

  inset:-7px;

}

  color:#138552;background:#e2fff1;
  padding:4px 8px;border-radius:20px;
}

  content:"";width:6px;height:6px;border-radius:50%;

}

  .container{padding-left:11px;padding-right:11px}

}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition:none!important}
}


/* ===== V999 APP SHELL ===== */
.quick-bar{
  display:flex;gap:8px;overflow:auto;padding:2px 0 12px;
  scrollbar-width:none;
}
.quick-bar::-webkit-scrollbar{display:none}
.quick-btn{

:root{
  --sale-a:#0b63ff; --sale-b:#00d4ff; --sale-glow:rgba(11,99,255,.35);
  --trade-a:#ff9d1f; --trade-b:#ffd43b; --trade-glow:rgba(255,157,31,.35);
}
.card{border-radius:20px;overflow:hidden;isolation:isolate;}
.card.type-sale{
  border:1px solid rgba(11,99,255,.18);
  box-shadow:0 6px 20px rgba(11,60,150,.10),0 0 0 1px rgba(11,99,255,.05) inset;
  background:linear-gradient(180deg,#ffffff 0%,#f5f9ff 100%);
}
.card.type-trade{
  border:1px solid rgba(255,157,31,.22);
  box-shadow:0 6px 20px rgba(150,100,10,.10),0 0 0 1px rgba(255,157,31,.06) inset;
  background:linear-gradient(180deg,#ffffff 0%,#fffaf0 100%);
}
.card.type-sale::before{
  content:"";position:absolute;inset:0 0 auto 0;height:4px;z-index:2;
  background:linear-gradient(90deg,var(--sale-a),var(--sale-b));
}
.card.type-trade::before{
  content:"";position:absolute;inset:0 0 auto 0;height:4px;z-index:2;
  background:repeating-linear-gradient(90deg,var(--trade-a) 0 10px,var(--trade-b) 10px 20px);
}
.card.type-sale .thumb{background:radial-gradient(circle at 30% 20%,rgba(11,99,255,.14),transparent 60%),linear-gradient(135deg,#e6f0ff,#f7fbff);}
.card.type-trade .thumb{background:radial-gradient(circle at 30% 20%,rgba(255,157,31,.16),transparent 60%),linear-gradient(135deg,#fff3dd,#fffaf0);}
.card .ribbon{
  position:absolute;top:16px;left:-1px;z-index:3;font:900 10px Cairo;color:#fff;
  padding:5px 12px 5px 10px;border-radius:0 8px 8px 0;letter-spacing:.2px;
  box-shadow:0 4px 10px rgba(0,0,0,.18);display:flex;align-items:center;gap:4px;
}
.card.type-sale .ribbon{background:linear-gradient(115deg,var(--sale-a),var(--sale-b));}
.card.type-trade .ribbon{background:linear-gradient(115deg,var(--trade-a),var(--trade-b));color:#4a2e00;}
.card.type-sale .badge.sale{background:linear-gradient(120deg,var(--sale-a),var(--sale-b));box-shadow:0 3px 10px var(--sale-glow);}
.card.type-trade .badge.trade{background:linear-gradient(120deg,var(--trade-a),var(--trade-b));color:#4a2e00;box-shadow:0 3px 10px var(--trade-glow);}

/* ══════════════════════════════════════════════════════════════════
   SONIC MARKET — SIGNATURE PASS
   Motif: the market "speaks" in sound — a pulsing waveform is the
   brand's fingerprint. Aurora-mesh depth replaces flat panels,
   Reem Kufi carries headline personality, JetBrains Mono renders
   every number/price/JSON token like a live data readout.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --navy-950:#03081c;
  --navy-900:#050f2e;
  --navy-800:#0a1a4a;
  --blue-1:#0c5dff;
  --blue-2:#3d8bff;
  --cyan-1:#22e6ff;
  --violet-1:#7b6bff;
  --gold-1:#ffcf3f;
  --gold-2:#ff9f43;
  --coral-1:#ff4d6a;
  --paper:#f3f7ff;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --display:'Reem Kufi','Cairo',sans-serif;
}

body{
  background:
    radial-gradient(ellipse 60% 40% at 10% -5%, rgba(34,230,255,.16), transparent 60%),
    radial-gradient(ellipse 55% 45% at 105% 8%, rgba(255,207,63,.15), transparent 55%),
    radial-gradient(ellipse 60% 50% at 50% 115%, rgba(123,107,255,.10), transparent 60%),
    linear-gradient(180deg,#eef4ff 0%, #f5f8ff 45%, #eef3ff 100%);
  background-attachment:fixed;
}

h1,h2,h3,h4,.brand-name,.hero-big,.cc-head b,.admin-header h2{
  font-family:var(--display);
  letter-spacing:.2px;
}
.price,.price.trade,.stat-pill b,.cc-number,.big-number,.stat-card .num,.health-box b,.profile-stat b{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
}

/* ---- signature waveform mark ---- */
.wave{display:inline-flex;align-items:flex-end;justify-content:center;gap:2.5px;height:16px;position:relative;z-index:1}
.wave i{display:block;width:3px;border-radius:2px;background:linear-gradient(180deg,#fff6cf,var(--gold-1));animation:waveBeat 1.15s ease-in-out infinite;box-shadow:0 0 6px rgba(255,207,63,.6)}
.wave i:nth-child(1){height:38%;animation-delay:0s}
.wave i:nth-child(2){height:100%;animation-delay:.14s}
.wave i:nth-child(3){height:62%;animation-delay:.28s}
.wave i:nth-child(4){height:82%;animation-delay:.42s}
.wave.muted i{background:linear-gradient(180deg,#c9d6f2,#9fb3e0);box-shadow:none}
@keyframes waveBeat{0%,100%{transform:scaleY(.42)}50%{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.wave i{animation:none;height:70%!important}}

/* ---- hero / header, rebuilt ---- */
.hero{
  background:
    radial-gradient(120% 140% at 100% 0%, rgba(34,230,255,.22), transparent 55%),
    radial-gradient(90% 120% at 0% 100%, rgba(255,207,63,.16), transparent 50%),
    linear-gradient(155deg, var(--navy-950) 0%, var(--navy-800) 48%, var(--blue-1) 100%);

  box-shadow:0 18px 40px rgba(3,10,35,.38), inset 0 -1px 0 rgba(255,255,255,.06);
}
.hero::after{
  width:220px;height:220px;left:-90px;bottom:-140px;
  border:26px solid rgba(255,255,255,.07);
  box-shadow:0 0 0 20px rgba(34,230,255,.05),0 0 0 46px rgba(255,207,63,.035);
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 26px);
  mask-image:linear-gradient(180deg, rgba(0,0,0,.5), transparent 75%);
}
.logo-ring{
  position:relative;overflow:visible;background:linear-gradient(150deg,#0c1c4d,#0a3ea8);
  box-shadow:0 0 0 4px rgba(255,255,255,.14), 0 6px 16px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.1);

.logo-ring::before{
  content:"";position:absolute;inset:-5px;border-radius:50%;

.brand-name{font-weight:700;font-size:21px}

/* ---- cards, elevated ---- */

<script>
const ADMIN_PASSWORD = "1221"; // غيّرها من هنا
const CATEGORIES = ["الكل","بيع","تبديل"];

const RARITIES = [

  {id:"اترنل", label:"◆ إترنال", accent:"#e42232", tint:"#ffe9ea", text:"#b3121f"},

  {id:"ماب نطه", label:"↗ ماب نطه"},

];
const CAT_ICONS = {"سكريت":"⬤","اترنل":"◆","ديفاين سماوى":"✦","ماب نطه":"↗","ماب سرقة":"⚡"};

let state = {
  favorites: [],
  favoritesView: false,
  currentUser: null, viewed: [], profileOpen: false, selectedGallery: 0,
  adminSearch: "", adminSelected: [], reports: [], notifications: [],
  sort: "newest",
  selectedItem: null,
  adminFilter: "pending",
  formDraft: {},
  view: "market",
  listings: [],
  loading: true,
  adminAuthed: false,
  search: "",
  categoryFilter: "الكل",
  showAddModal: false,
  toast: null,
  pendingImages: [],

  formPaymentStore: "gamepass",
  formBankAccount: "",

  formMapType: "ماب نطه",

  showSuccessModal: false,
  jsonViewOpen: false,
  adminTab: "queue",
  requests: [],
  requestCounter: 0,

    siteTagline: "بيع وبدّل أغراضك بسرعة الصوت ✦",
    homeKicker: "SONIC MARKET",
    homeHeadline: "بيع. بدّل. اكتشف. بسرعة سونيك.",
    homeSub: "سوق إعلانات سريع — كل إعلان يمر بالمراجعة قبل ظهوره للناس.",
    closedMessage: "السوق مغلق مؤقتاً من قبل الإدارة — عد لاحقاً.",
    showPrice: true,
    showViews: true,
    showCategoryBadge: true,
  },
};

const LOCAL_KEY = "sonic_market_listings_v99";
function storageAvailable(){
  try{
    const x="__sonic_test__";
    localStorage.setItem(x,x); localStorage.removeItem(x);
    return true;
  }catch(e){ return false; }
}
async function loadListings(){
  try{
    if(window.storage && typeof window.storage.get==="function"){
      const res = await window.storage.get("listings", true);
      if(res && res.value){
        state.listings = JSON.parse(res.value);
      }else{
        const raw = storageAvailable() ? localStorage.getItem(LOCAL_KEY) : null;
        state.listings = raw ? JSON.parse(raw) : [];
      }
    }else{
      const raw = storageAvailable() ? localStorage.getItem(LOCAL_KEY) : null;
      state.listings = raw ? JSON.parse(raw) : [];
    }
  }catch(e){
    try{
      const raw = storageAvailable() ? localStorage.getItem(LOCAL_KEY) : null;
      state.listings = raw ? JSON.parse(raw) : [];
    }catch(_){ state.listings=[]; }
  }
  state.loading = false;
  openSharedItemFromHash();
  render();
}
async function saveListings(){
  const payload = JSON.stringify(state.listings);
  let saved=false;
  try{
    // The embedded storage API can reject large base64 image payloads with an Internal error.
    // Prefer local persistence for oversized snapshots and keep the shared API for smaller ones.
    if(window.storage && typeof window.storage.set==="function" && payload.length < 900000){
      await window.storage.set("listings", payload, true);
      saved=true;
    }
  }catch(e){
    console.warn("shared storage unavailable; using local fallback", e);
  }
  if(!saved){
    try{
      if(!storageAvailable()) throw new Error("localStorage unavailable");
      localStorage.setItem(LOCAL_KEY, payload);
      saved=true;
    }catch(e){
      console.error("storage error", e);
      showToast("✕ تعذر حفظ البيانات: التخزين ممتلئ أو غير متاح");
    }
  }
  state.lastSync=Date.now();
}
const SETTINGS_KEY = "sonic_market_settings_v1";
async function loadSiteSettings(){
  try{
    if(window.storage && typeof window.storage.get==="function"){
      const res = await window.storage.get("settings", true);
      if(res && res.value) state.settings = Object.assign({}, state.settings, JSON.parse(res.value));
    }else{
      const raw = storageAvailable() ? localStorage.getItem(SETTINGS_KEY) : null;
      if(raw) state.settings = Object.assign({}, state.settings, JSON.parse(raw));
    }
  }catch(e){
    try{
      const raw = storageAvailable() ? localStorage.getItem(SETTINGS_KEY) : null;
      if(raw) state.settings = Object.assign({}, state.settings, JSON.parse(raw));
    }catch(_){}
  }
  render();
}
async function saveSiteSettings(){
  try{
    const payload = JSON.stringify(state.settings);
    if(window.storage && typeof window.storage.set==="function"){
      await window.storage.set("settings", payload, true);
    }else if(storageAvailable()){
      localStorage.setItem(SETTINGS_KEY, payload);
    }
  }catch(e){
    try{ if(storageAvailable()) localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }catch(_){}
    console.error("settings storage error", e);
  }
}
function toggleSetting(key){
  state.settings[key] = !state.settings[key];
  saveSiteSettings(); recordActivity("⬡","تحكم: "+key+" → "+(state.settings[key]?"مفعّل":"معطّل")); render();
}
function updateSettingText(key,val){
  state.settings[key] = val; saveSiteSettings();
}
const REQUESTS_KEY = "sonic_market_requests_v1";
async function loadRequests(){
  try{
    if(window.storage && typeof window.storage.get==="function"){
      const res = await window.storage.get("requests", true);
      state.requests = res && res.value ? JSON.parse(res.value) : [];
    }else{
      const raw = storageAvailable() ? localStorage.getItem(REQUESTS_KEY) : null;
      state.requests = raw ? JSON.parse(raw) : [];
    }
  }catch(e){
    try{
      const raw = storageAvailable() ? localStorage.getItem(REQUESTS_KEY) : null;
      state.requests = raw ? JSON.parse(raw) : [];
    }catch(_){ state.requests=[]; }
  }
  state.requestCounter = state.requests.reduce((m,r)=>Math.max(m,r.number||0),0);
  render();
}
async function saveRequests(){
  try{
    const payload = JSON.stringify(state.requests);
    if(window.storage && typeof window.storage.set==="function"){
      await window.storage.set("requests", payload, true);
    }else if(storageAvailable()){
      localStorage.setItem(REQUESTS_KEY, payload);
    }
  }catch(e){
    try{ if(storageAvailable()) localStorage.setItem(REQUESTS_KEY, JSON.stringify(state.requests)); }catch(_){}
    console.error("requests storage error", e);
  }
}
function paymentStoreLabel(storeId){
  return (PAYMENT_STORES.find(s=>s.id===storeId)||{}).label || "✨ بطاقة شحن";
}
function calcCodesNeeded(priceStr){
  const num = parseFloat((priceStr||"").toString().replace(/[^0-9.]/g,"")) || 0;
  return Math.max(1, Math.ceil(num/75));
}
function freeFire2200Guide(){
  return `بطاقة فري فاير 2200 جوهرة سعرها 75 ريال في Like Card ودليل ستور وقت إعداد هذه النسخة. اشترِ العدد المطلوب فقط من مصدر موثوق، ثم أدخل الأكواد في الخانات المخصصة للطلب. لا تشارك الأكواد خارج طلبك مع أي شخص غير المسؤول المعتمد.`;
}
function showFreeFireGuide(){
  state.freeFireGuideOpen = true;
  render();
}
function closeFreeFireGuide(){
  state.freeFireGuideOpen = false;
  render();
}
function openRequestModal(id){
  const it = state.listings.find(x=>x.id===id);
  if(!it) return;
  state.requestItemId = id;
  state.requestTradeImage = null;
  state.requestFreeFireCodes = Array(10).fill("");
  state.showRequestModal = true;
  render();
}
function closeRequestModal(){ state.showRequestModal=false; state.requestItemId=null; state.requestTradeImage=null; state.requestFreeFireCodes=Array(10).fill(""); render(); }
function closeRequestSuccessModal(){ state.showRequestSuccessModal=null; state.requestFreeFireCodes=Array(10).fill(""); render(); }
function onRequestTradeImagePick(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  fileToCompressedDataUrl(file, (dataUrl)=>{ state.requestTradeImage=dataUrl; render(); });
}
function updateFreeFireCode(i,value){
  if(!Array.isArray(state.requestFreeFireCodes)) state.requestFreeFireCodes=Array(10).fill("");
  state.requestFreeFireCodes[i]=(value||"").trim().slice(0,80);
}
function freeFireCodesRequired(price){
  return calcCodesNeeded(price);
}
function freeFireCodeFields(required){
  // عدد الخانات يظهر حسب السعر: 75 ريال = 1، 150 = 2، 750 = 10.
  const n=Math.max(1,Math.ceil(Number(required)||1));
  if(n>10){
    return `<div class="notice" style="background:#fff0f0;color:#9b1c1c">هذا السعر يحتاج ${n} أكواد، بينما الحد الأقصى للطلب الواحد هو 10 أكواد.</div>`;
  }
  return Array.from({length:n},(_,i)=>{
    const value=esc((state.requestFreeFireCodes&&state.requestFreeFireCodes[i])||"");
    return `<div class="ff-code-row required"><span>${i+1}</span><input type="text" inputmode="text" autocomplete="off" required value="${value}" oninput="updateFreeFireCode(${i},this.value)" placeholder="كود فري فاير ${i+1} *"></div>`;
  }).join("");
}

function submitRequest(){
  const it = state.listings.find(x=>x.id===state.requestItemId);
  if(!it){ closeRequestModal(); return; }
  let buyer;
  if(it.type==="تبديل"){
    const tiktok = (document.getElementById("rq_tiktok")||{}).value?.trim();
    const fortnite = (document.getElementById("rq_fortnite")||{}).value?.trim();
    if(!state.requestTradeImage){ showToast("△ من فضلك ارفع صورة الشيء الذي تريد التبديل به"); return; }
    if(!tiktok){ showToast("△ من فضلك أدخل اسم حساب تيك توك"); return; }
    if(!fortnite){ showToast("△ من فضلك أدخل اسم حساب فورتنايت"); return; }
    buyer = { tiktok, fortnite, tradeImage: state.requestTradeImage };
  } else {
    const firstName = (document.getElementById("rq_first")||{}).value?.trim();
    const lastName = (document.getElementById("rq_last")||{}).value?.trim();
    const tiktok = (document.getElementById("rq_tiktok2")||{}).value?.trim();
    if(!firstName){ showToast("△ من فضلك اكتب اسمك"); return; }
    if(!lastName){ showToast("△ من فضلك اكتب لقبك"); return; }
    if(!tiktok){ showToast("△ من فضلك أدخل اسم حساب تيك توك"); return; }
    const codesNeeded = freeFireCodesRequired(it.price);
    if(codesNeeded>10){ showToast("✕ هذا الطلب يحتاج أكثر من 10 أكواد. الحد الحالي هو 10 أكواد لكل طلب."); return; }
    const cardReady = document.getElementById("rq_card_ready")?.checked;
    if(!cardReady){ showToast("△ أكد أولاً أنك اشتريت/وفرت بطاقات فري فاير المطلوبة"); return; }
    const allCodes = Array.isArray(state.requestFreeFireCodes) ? state.requestFreeFireCodes : [];
    const codes = Array.from({length:codesNeeded},(_,i)=>(allCodes[i]||"").trim());
    // منع الإرسال بشكل صارم: يجب إدخال كل خانة مطلوبة، وليس بعض الأكواد فقط.
    if(codes.length !== codesNeeded || codes.some(code=>code.length===0)){
      showToast("✕ لا يمكن إكمال الطلب: يجب كتابة جميع أكواد فري فاير المطلوبة ("+codesNeeded+"/"+codesNeeded+")");
      return;
    }
    buyer = {
      firstName, lastName, tiktok,
      payMethod: "بطاقات فري فاير 2200 جوهرة",
      paymentUnitPrice:75,
      cardsNeeded: codesNeeded,
      totalCardValue: codesNeeded*75,
      cardReady:true,
      freeFireCodes: codes,
      deliveryNote:"تم استلام أكواد فري فاير ضمن الطلب ويجب التعامل معها بسرية. يتم استكمال العملية عبر المسؤول."
    };
  }
  state.requestCounter = (state.requestCounter||0) + 1;
  const req = {
    id: "req_"+Date.now(), number: state.requestCounter,
    itemId: it.id, itemTitle: it.title, itemType: it.type, itemPrice: it.price||null,
    createdAt: Date.now(), status: "new", buyer
  };
  state.requests.unshift(req);
  saveRequests();
  recordActivity("▤","طلب جديد #"+req.number+" على: "+it.title);
  state.notifications.push("طلب جديد #"+req.number);
  state.showRequestModal = false; state.requestItemId = null;
  state.showRequestSuccessModal = req.number;
  render();
}

function fileToCompressedDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 360;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL("image/jpeg", 0.65));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* Engagement chips — the age chip and "in your favorites" chip use real
   data. The view-count and "hype" chips are simulated: seeded from the
   item id so a given item always shows the same numbers (no jumping
   around on refresh), growing slowly with the item's age. */
function seedFromId(id){
  let h=0; for(let i=0;i<(id||"").length;i++){ h=(h*31+id.charCodeAt(i))>>>0; }
  return h;
}
function fakeViews(it){
  const seed=seedFromId(it.id);
  const base=6+(seed%35);
  const ageHours=Math.max(0,(Date.now()-(it.createdAt||Date.now()))/3600000);
  const growth=Math.min(180,Math.floor(ageHours*(2+(seed%5))));
  return base+growth;
}
function fakeHype(it){ return seedFromId((it.id||"")+"_hype")%100; }
function engagementChips(it){
  const chips=[];
  const ageMin=Math.floor((Date.now()-(it.createdAt||Date.now()))/60000);
  const favCount=state.favorites.includes(it.id)?1:0;
  const views=fakeViews(it);
  const hype=fakeHype(it);
  if(ageMin<180) chips.push(`<span class="ls-chip"><span class="ls-dot"></span>جديد · ${ageMin<1?'الآن':timeAgo(it.createdAt)}</span>`);
  chips.push(`<span class="ls-chip">◉ ${views} مشاهدة</span>`);
  if(views>=25) chips.push(`<span class="ls-chip hot">✦ رائج</span>`);
  if(hype>=70) chips.push(`<span class="ls-chip hot">◈ طلب مرتفع الآن</span>`);
  else if(hype>=45) chips.push(`<span class="ls-chip">⚡ اهتمام كبير</span>`);
  if(favCount) chips.push(`<span class="ls-chip">♥ في مفضلتك</span>`);
  if(!chips.length) return "";
  return `<div class="live-stats">${chips.join("")}</div>`;
}

function syntaxHighlightJson(obj){
  const json = JSON.stringify(obj, null, 2);
  const escaped = json.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return escaped.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g, function(match){
    let cls = "jn";
    if(/^"/.test(match)){ cls = /:$/.test(match) ? "jk" : "js"; }
    else if(/true|false/.test(match)){ cls = "jb"; }
    else if(/null/.test(match)){ cls = "jp"; }
    return `<span class="${cls}">${match}</span>`;
  });
}
function buildJsonView(){
  const s = getStats();
  const sample = state.listings.filter(x=>x.status==="approved").slice(0,3).map(x=>({
    id:x.id, title:x.title, category:x.category, type:x.type, price:x.price||null, views:x.views||0
  }));
  const payload = {
    market:"sonic-market",
    syncedAt:new Date(state.lastSync||Date.now()).toISOString(),
    stats:{approved:s.approved,pending:s.pending,views:s.views},
    categories:CATEGORIES.filter(c=>c!=="الكل"),
    listings:sample
  };
  return syntaxHighlightJson(payload);
}
function controlCenterScore(){
  const s=getStats();
  let n=0;
  n+=Math.min(25,s.approved*2);
  n+=Math.min(25,s.views);
  n+=state.favorites.length?15:0;
  n+=state.activity.length?15:0;
  n+=s.pending===0?20:Math.max(0,20-s.pending*3);
  return Math.min(100,Math.round(n));
}
function controlCenterHealth(){
  const s=getStats();
  return Math.min(100,Math.round((s.approved?35:18)+(storageAvailable()?30:0)+(s.pending===0?20:12)+(state.activity.length?15:5)));
}
function controlCenterAction(a){
  recordActivity("✦","مركز التحكم: "+a);
  if(a==="publish")openAddModal();
  else if(a==="admin")openAdmin();
  else if(a==="backup")exportBackup();
  else if(a==="home")goHome();
  else if(a==="clearRecent")clearRecent();
  else if(a==="smart")toggleSmart();
  state.controlCenterOpen=false;render();
}

function setView(v){ state.view = v; if(v==="admin" && state.adminAuthed) markAllNotificationsRead(); render(); }
function onSearch(v){ state.search = v; render(); }
function onCategoryChange(v){ state.categoryFilter = v; render(); }
function setFormType(t){ state.formType = t; state.formDraft.type=t; render(); }
function openAddModal(){
  state.showAddModal = true; state.editingId = null; state.pendingImages = [];
  state.formType = "بيع"; state.formRarity = "سكريت"; state.formMapType = "ماب نطه";
  state.formPaymentMethod = "store"; state.formPaymentStore = "gamepass"; state.formBankAccount = "";
  render();
}
function openEditModal(id){
  const it = state.listings.find(x=>x.id===id);
  if(!it) return;
  state.showAddModal = true;
  state.editingId = id;
  state.pendingImages = Array.isArray(it.images) ? it.images.slice() : (it.image?[it.image]:[]);
  state.formType = it.type||"بيع";
  state.formRarity = it.category||"سكريت";
  state.formMapType = it.mapType||"ماب نطه";
  state.formPaymentMethod = it.paymentMethod||"store";
  state.formPaymentStore = it.paymentStore||"gamepass";
  state.formBankAccount = it.bankAccount||"";
  state.profileOpen = false;
  render();
  renderImgPreview();
}
function closeAddModal(){ state.showAddModal = false; state.editingId = null; render(); }
function closeSuccessModal(){ state.showSuccessModal = false; render(); }
function renderImgPreview(){
  const wrap = document.getElementById("imgPreviewWrap");
  if(!wrap) return;
  wrap.innerHTML = state.pendingImages.map((im,i)=>`<div style="position:relative"><img src="${im}" class="img-preview"><button type="button" onclick="removePendingImage(${i})" style="position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#ff3b3b;color:#fff;font-size:12px;cursor:pointer;line-height:1">✕</button></div>`).join("");
}
function onImagePick(e){
  const files = Array.from(e.target.files||[]).slice(0, 5 - state.pendingImages.length);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{
    fileToCompressedDataUrl(file, (dataUrl)=>{
      state.pendingImages.push(dataUrl);
      remaining--;
      if(remaining===0) renderImgPreview();
    });
  });
}
function removePendingImage(i){ state.pendingImages.splice(i,1); renderImgPreview(); }
function setFormRarity(r){ state.formRarity = r; render(); }
function setFormMapType(m){ state.formMapType = m; render(); }
function setPaymentMethod(method){
  state.formPaymentMethod = method;
  render();
}
function setPaymentStore(store){
  state.formPaymentStore = store;
  state.formPaymentMethod = "store";
  render();
}
function submitListing(){
  ensureUser();

  const title = document.getElementById("f_title").value.trim();
  const category = state.formRarity;
  const price = document.getElementById("f_price").value.trim();
  const contact = document.getElementById("f_contact").value.trim();
  const tiktok = document.getElementById("f_tiktok").value.trim();
  const fortnite = document.getElementById("f_fortnite").value.trim();
  const bankInput = document.getElementById("f_bank");
  if(bankInput) state.formBankAccount = bankInput.value.trim();
  if(!title){ showToast("△ من فضلك اكتب عنوان الغرض"); return; }
  if(!tiktok){ showToast("△ من فضلك أدخل اسم حساب تيك توك"); return; }
  if(!fortnite){ showToast("△ من فضلك أدخل اسم حساب فورتنايت"); return; }
  if(state.formType==="بيع"){
    const priceNum = parseFloat((price||"").replace(/[^0-9.]/g,""))||0;
    if(!price || priceNum < 75){ showToast("△ الحد الأدنى للسعر هو 75 ريال"); return; }
    if(state.formPaymentMethod==="transfer" && !state.formBankAccount){ showToast("△ من فضلك اكتب رقم الحساب البنكي"); return; }
  }
  const payload = {
    title, category, mapType: state.formMapType, price, contact, tiktok, fortnite, type: state.formType, images: state.pendingImages,
    paymentMethod: state.formType==="بيع" ? state.formPaymentMethod : null,
    paymentStore: state.formType==="بيع" && state.formPaymentMethod==="store" ? state.formPaymentStore : null,
    bankAccount: state.formType==="بيع" && state.formPaymentMethod==="transfer" ? state.formBankAccount : null,
  };
  if(state.editingId){
    updateListing(state.editingId, payload);
  } else {
    addListing(payload);
  }
  state.showAddModal = false;
  state.editingId = null;
  render();
}
function deleteMyListing(id){
  state.listings = state.listings.filter(x=>x.id!==id);
  saveListings(); render(); showToast("⌫ تم حذف إعلانك");
}
function updateListing(id, data){
  const it = state.listings.find(x=>x.id===id);
  if(!it) return;
  const imgs = Array.isArray(data.images) ? data.images.filter(Boolean) : [];
  Object.assign(it, {
    title: data.title, type: data.type, price: data.price, category: data.category, mapType: data.mapType||"ماب نطه",
    contact: data.contact, paymentMethod: data.paymentMethod||null, paymentStore: data.paymentStore||null,
    bankAccount: data.bankAccount||null, tiktok: data.tiktok, fortnite: data.fortnite,
    image: imgs[0]||it.image||null, images: imgs.length?imgs:it.images,
    status: "pending"
  });
  saveListings();
  recordActivity("✎","تعديل إعلان: "+it.title);
  showToast("✎ تم حفظ التعديلات — سيُعاد نشره بعد المراجعة");
}
function tryAdminLogin(){
  const val = document.getElementById("adminPassInput").value;
  if(val === ADMIN_PASSWORD){ state.adminAuthed = true; markAllNotificationsRead(); render(); }
  else { showToast("✕ كلمة السر غير صحيحة"); }
}
function adminLogout(){ state.adminAuthed = false; render(); }

hydrateUserPrefs();
try{state.reports=JSON.parse(localStorage.getItem("sonic_market_reports_v9999")||"[]")}catch(e){state.reports=[]}
ensureUser();
loadActivity();
try{state.lastSync=Date.now()}catch(e){}
render();
loadListings();
loadSiteSettings();
loadRequests();
</script>
</body>
</html>
