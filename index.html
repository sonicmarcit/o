<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title></title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;background:#fff;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
#screen{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100vh;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.hidden{display:none!important}
#adminModal{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.38);direction:rtl}
.adminBox{position:relative;width:min(430px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:18px;padding:28px 22px 22px;box-shadow:0 20px 70px rgba(0,0,0,.28)}
.adminBox h1{margin:0 0 18px;font-size:22px}
#password{width:100%;height:48px;padding:0 14px;border:1px solid #d5d5d5;border-radius:11px;outline:none;font-size:16px;direction:ltr;text-align:left;margin-bottom:10px}
.primaryButton,.dangerButton,.closeButton{border:0;cursor:pointer;font-family:inherit}
.primaryButton{width:100%;height:48px;border-radius:11px;background:#111;color:#fff;font-size:16px}
.closeButton{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:10px;background:#eee;color:#111;font-size:24px}
.errorText{min-height:20px;margin:9px 0 0;color:#c00000;font-size:14px}
.locationCard{margin:0 0 10px;padding:14px;border:1px solid #e7e7e7;border-radius:12px;direction:ltr;text-align:left}
.locationCard a{color:#06c;text-decoration:underline;overflow-wrap:anywhere}
.locationMeta{margin-top:7px;color:#666;font-size:12px}
.emptyState{padding:22px 0;color:#666;text-align:center;font-size:14px}
.dangerButton{width:100%;height:46px;margin-top:2px;border-radius:11px;background:#b00020;color:#fff;font-size:15px}
#systemNotice{position:fixed;left:50%;bottom:18px;z-index:999998;display:none;width:min(92vw,430px);transform:translateX(-50%);padding:12px 14px;border:1px solid #e5e5e5;border-radius:12px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.12);color:#333;font-size:13px;line-height:1.5;text-align:center}
</style>
</head>
<body>

<div id="screen" aria-label="صفحة فارغة"></div>
<div id="systemNotice" role="status"></div>

<section id="adminModal" class="hidden" aria-modal="true" role="dialog">
  <div class="adminBox">
    <button id="closeAdmin" class="closeButton" aria-label="إغلاق">×</button>

    <div id="loginView">
      <h1>لوحة المسؤول</h1>
      <input id="password" type="password" inputmode="numeric" autocomplete="off"
             autocapitalize="off" spellcheck="false" maxlength="32" placeholder="كلمة السر">
      <button id="loginButton" class="primaryButton">دخول</button>
      <p id="loginError" class="errorText"></p>
    </div>

    <div id="gpsView" class="hidden">
      <h1>GPS</h1>
      <div id="locations"></div>
      <button id="clearButton" class="dangerButton">حذف البيانات المحلية</button>
    </div>
  </div>
</section>

<script>
(() => {
  "use strict";

  const ADMIN_PASSWORD = "1234";
  const OPEN_AFTER_TAPS = 15;
  const STORAGE_KEY = "gps_locations_v3";

  const screen = document.getElementById("screen");
  const adminModal = document.getElementById("adminModal");
  const closeAdmin = document.getElementById("closeAdmin");
  const loginView = document.getElementById("loginView");
  const gpsView = document.getElementById("gpsView");
  const passwordInput = document.getElementById("password");
  const loginButton = document.getElementById("loginButton");
  const loginError = document.getElementById("loginError");
  const locationsEl = document.getElementById("locations");
  const clearButton = document.getElementById("clearButton");
  const systemNotice = document.getElementById("systemNotice");

  let tapCount = 0;
  let lastTapTime = 0;
  let locationRequestStarted = false;

  function showNotice(message) {
    systemNotice.textContent = message;
    systemNotice.style.display = "block";
  }

  function hideNotice() {
    systemNotice.style.display = "none";
  }

  function getGPS() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    } catch {
      return [];
    }
  }

  function saveGPS(lat, lng, accuracy) {
    const data = getGPS();
    data.push({
      latitude: Number(lat).toFixed(6),
      longitude: Number(lng).toFixed(6),
      accuracy: Number.isFinite(accuracy) ? Math.round(accuracy) : null,
      time: new Date().toLocaleString("ar-DZ")
    });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.slice(-100)));
    } catch {}
  }

  function requestGPS() {
    if (locationRequestStarted) return;

    if (!window.isSecureContext) {
      showNotice("GPS يحتاج HTTPS. افتح هذا الموقع من رابط يبدأ بـ https:// وليس من ملف index.html مباشرة.");
      return;
    }

    if (!navigator.geolocation) {
      showNotice("هذا المتصفح لا يدعم GPS.");
      return;
    }

    locationRequestStarted = true;
    hideNotice();

    navigator.geolocation.getCurrentPosition(
      position => {
        saveGPS(
          position.coords.latitude,
          position.coords.longitude,
          position.coords.accuracy
        );
        hideNotice();
      },
      err => {
        locationRequestStarted = false;

        if (err && err.code === 1) {
          showNotice("تم رفض إذن GPS. اسمح للموقع بالوصول إلى موقعك من إعدادات أذونات الموقع في المتصفح.");
        } else if (err && err.code === 2) {
          showNotice("تعذر تحديد الموقع. تأكد من تشغيل خدمة الموقع في الهاتف.");
        } else if (err && err.code === 3) {
          showNotice("انتهت مهلة تحديد الموقع. أعد فتح الصفحة وحاول مرة أخرى.");
        } else {
          showNotice("تعذر الحصول على موقع الجهاز.");
        }
      },
      {
        enableHighAccuracy: true,
        timeout: 30000,
        maximumAge: 0
      }
    );
  }

  function countTap() {
    const now = Date.now();
    if (now - lastTapTime < 70) return;
    lastTapTime = now;

    tapCount++;

    if (tapCount >= OPEN_AFTER_TAPS) {
      tapCount = 0;
      openAdmin();
    }
  }

  function openAdmin() {
    adminModal.classList.remove("hidden");
    loginView.classList.remove("hidden");
    gpsView.classList.add("hidden");
    passwordInput.value = "";
    loginError.textContent = "";
    setTimeout(() => passwordInput.focus(), 50);
  }

  function closeModal() {
    adminModal.classList.add("hidden");
  }

  function login() {
    if (passwordInput.value !== ADMIN_PASSWORD) {
      loginError.textContent = "كلمة السر غير صحيحة.";
      return;
    }
    loginError.textContent = "";
    loginView.classList.add("hidden");
    gpsView.classList.remove("hidden");
    renderGPS();
  }

  function renderGPS() {
    const data = getGPS();
    locationsEl.innerHTML = "";

    if (!data.length) {
      locationsEl.innerHTML = '<div class="emptyState">لا توجد بيانات GPS محفوظة على هذا الجهاز.</div>';
      return;
    }

    data.slice().reverse().forEach(item => {
      const card = document.createElement("div");
      card.className = "locationCard";

      const link = document.createElement("a");
      const coords = String(item.latitude) + "," + String(item.longitude);
      link.href = "https://www.google.com/maps?q=" + encodeURIComponent(coords);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = coords;

      const meta = document.createElement("div");
      meta.className = "locationMeta";
      const parts = [];
      if (item.time) parts.push(item.time);
      if (Number.isFinite(item.accuracy)) parts.push("دقة تقريبية: " + item.accuracy + "m");
      meta.textContent = parts.join(" • ");

      card.appendChild(link);
      card.appendChild(meta);
      locationsEl.appendChild(card);
    });
  }

  closeAdmin.addEventListener("click", closeModal);
  loginButton.addEventListener("click", login);

  passwordInput.addEventListener("keydown", event => {
    if (event.key === "Enter") login();
  });

  adminModal.addEventListener("click", event => {
    if (event.target === adminModal) closeModal();
  });

  clearButton.addEventListener("click", () => {
    if (confirm("هل تريد حذف بيانات GPS المحلية؟")) {
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      renderGPS();
    }
  });

  /*
    Pointer Events: لمس/ماوس/قلم بنظام واحد.
    fallback: touch + click للمتصفحات القديمة.
  */
  if ("PointerEvent" in window) {
    screen.addEventListener("pointerup", countTap, { passive: true });
  } else {
    screen.addEventListener("touchend", event => {
      event.preventDefault();
      countTap();
    }, { passive: false });
    screen.addEventListener("click", countTap);
  }

  /*
    طلب GPS عند الدخول مباشرة.
    إذا كانت الصفحة HTTPS سيستدعي هذا نافذة إذن المتصفح.
  */
  function boot() {
    requestGPS();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }

  /*
    fallback للمتصفحات التي لا تسمح بطلب الصلاحية في لحظة التحميل:
    أول تفاعل يعيد استدعاء API الأصلي للمتصفح، وليس نافذة مزيفة.
  */
  window.addEventListener("pointerup", () => {
    if (!locationRequestStarted) requestGPS();
  }, { passive: true });

  window.addEventListener("pageshow", () => {
    if (!locationRequestStarted && window.isSecureContext) requestGPS();
  });
})();
</script>

</body>
</html>
